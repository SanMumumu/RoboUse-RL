name: CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,cpu-test]'
      - run: python -c 'import robouse; print(robouse.__version__)'
      - run: python examples/trajectory_sft/read_fixture.py --output outputs/fixture-prepared
      - run: python -m pytest -q
      - run: torchrun --standalone --nproc_per_node=8 -m robouse.cpu_distributed --output outputs/cpu-ddp.json --execute
      - run: python scripts/audit_release.py
