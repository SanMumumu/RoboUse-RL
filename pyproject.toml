[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "robouse-rl"
version = "0.1.0"
description = "A modular framework for training tool-using robotic agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["Pillow==11.2.1", "PyYAML==6.0.2", "numpy==2.2.6", "tqdm==4.67.1", "jsonschema==4.26.0", "pydantic==2.12.5"]
[project.urls]
Repository = "https://github.com/SanMumumu/RoboUse-RL"
Issues = "https://github.com/SanMumumu/RoboUse-RL/issues"
[project.scripts]
robouse = "robouse.cli:main"
[project.optional-dependencies]
test = ["pytest==9.0.2", "torch==2.7.0"]
cpu-test = ["torchvision==0.22.0", "transformers==5.8.1", "accelerate==1.13.0", "tensorboard==2.21.0", "pyarrow==23.0.1"]
train = ["torch==2.7.0", "torchvision==0.22.0", "transformers==5.8.1", "accelerate==1.13.0", "deepspeed==0.19.0", "tensorboard==2.21.0", "pyarrow==23.0.1"]
transport = ["mcp==1.26.0", "h5py==3.13.0", "msgpack==1.1.0", "msgpack-numpy==0.4.8", "opencv-python-headless==4.11.0.86", "websockets==15.0.1"]
[tool.setuptools.packages.find]
include = ["robouse*", "agp_rl*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"agp_rl.pipeline2b" = ["code_runner.js"]
"robouse._vendor" = ["provenance.json"]

"robouse" = ["configs/*.json", "_native/**/*"]
